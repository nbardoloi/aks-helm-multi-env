trigger:
  - main

pool:
  name: 'Default'    # Your self-hosted agent pool

variables:
  imageRepository: 'nbardoloi/demodocker'
  dockerRegistryServiceConnection: 'dockerhub-connection'
  helmChartPath: 'helm/my-app'

stages:

# ==========================
# Build Stage
# ==========================
- stage: Build
  displayName: Build and Push Docker Image
  
  jobs:
  - job: BuildJob
    displayName: Build Container

    steps:

    - checkout: self

    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: 'app/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

    - task: HelmInstaller@1
      displayName: Install Helm
      inputs:
        helmVersionToInstall: '4.1.4'

# ==========================
# Deploy to Dev
# ==========================
- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: Build

  jobs:
  - deployment: DeployJob
    environment: Dev
    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - script: |
              echo USERNAME=%USERNAME%
              echo USERPROFILE=%USERPROFILE%
              whoami

              kubectl config view
              kubectl config current-context
              kubectl get nodes
            displayName: Debug Kubernetes

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: '4.1.4'

          - script: |
              kubectl config current-context
              kubectl get nodes

           
          - script: |
              helm upgrade --install my-app-dev "$(System.DefaultWorkingDirectory)\$(helmChartPath)" --namespace dev --create-namespace -f "$(System.DefaultWorkingDirectory)\$(helmChartPath)\values.dev.yaml" --set image.tag=$(Build.BuildId)
            displayName: Deploy to Minikube (Dev)

# ==========================
# Deploy to QA
# ==========================
- stage: DeployToQA
  displayName: Deploy to QA
  dependsOn: DeployToDev

  jobs:
  - deployment: DeployQAJob
    environment: QA
    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: '3.11.0'

          - script: |
              kubectl config current-context
              kubectl get nodes

              helm upgrade --install my-app-qa \
                $(System.DefaultWorkingDirectory)/$(helmChartPath) \
                --namespace qa \
                --create-namespace \
                -f $(System.DefaultWorkingDirectory)/$(helmChartPath)/values.qa.yaml \
                --set image.tag=$(Build.BuildId)
            displayName: Deploy to Minikube (QA)