trigger:
  - main

pool:
  name: 'Default'    # Your self-hosted agent pool

parameters:
- name: buildImage
  type: boolean
  default: true

- name: imageTag
  type: string
  default: latest

variables:
  imageRepository: 'nbardoloi/demodocker'
  dockerRegistryServiceConnection: 'dockerhub-connection'
  helmChartPath: 'helm/my-app'

stages:

# ==========================
# Build Stage
# ==========================
- stage: Build
  displayName: Build and Push Docker Image
  condition: eq('${{ parameters.buildImage }}', true)

  jobs:
  - job: BuildJob
    displayName: Build Container

    steps:

    - checkout: self

    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: 'app/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

    - task: HelmInstaller@1
      displayName: Install Helm
      inputs:
        helmVersionToInstall: '4.1.4'

# ==========================
# Deploy to Dev
# ==========================
- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: 

  jobs:
  - deployment: DeployJob
    environment: Dev
    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: '4.1.4'

          - script: |
              kubectl config current-context
              kubectl get nodes

              helm upgrade --install my-app-dev \
                $(System.DefaultWorkingDirectory)/$(helmChartPath) \
                --namespace dev \
                --create-namespace \
                -f $(System.DefaultWorkingDirectory)/$(helmChartPath)/values.dev.yaml \
                #--set image.tag=$(Build.BuildId)
                --set image.tag=${{ parameters.imageTag }}
            displayName: Deploy to Minikube (Dev)

# ==========================
# Deploy to QA
# ==========================
- stage: DeployToQA
  displayName: Deploy to QA
  dependsOn: DeployToDev

  jobs:
  - deployment: DeployQAJob
    environment: QA
    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: '3.11.0'

          - script: |
              kubectl config current-context
              kubectl get nodes

              helm upgrade --install my-app-qa \
                $(System.DefaultWorkingDirectory)/$(helmChartPath) \
                --namespace qa \
                --create-namespace \
                -f $(System.DefaultWorkingDirectory)/$(helmChartPath)/values.qa.yaml \
                --set image.tag=$(Build.BuildId)
            displayName: Deploy to Minikube (QA)